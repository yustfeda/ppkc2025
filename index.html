<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purna Paskibra Kecamatan Cileles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      html { font-size: 14px; }
      body { 
        font-size: 1rem; 
        background-color: #F5F5F5;
      }
      .dark body {
        background-color: #1A1A2E;
      }
      /* Button & Card hover effect */
      .interactive-card, button, a.button, input[type="submit"], input[type="button"] {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      }
      .interactive-card:hover, button:hover, a.button:hover, input[type="submit"]:hover, input[type="button"]:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      button:active, a.button:active, input[type="submit"]:active, input[type="button"]:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }
       /* Hamburger Menu Animation */
      .hamburger {
        cursor: pointer;
        padding: 10px;
        display: inline-block;
      }
      .hamburger-line {
        width: 24px;
        height: 2px;
        background-color: #333;
        display: block;
        margin: 5px 0;
        transition: all 0.3s ease-in-out;
      }
      .dark .hamburger-line { background-color: #F5F5F5; }
      .hamburger.is-active .hamburger-line:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      .hamburger.is-active .hamburger-line:nth-child(2) {
        opacity: 0;
      }
      .hamburger.is-active .hamburger-line:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }
      
      /* Animations */
      @keyframes slide-in {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes float-animation {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in-scale {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes fade-out-scale {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(0.95); }
      }
      .animate-float {
        animation: float-animation 6s ease-in-out infinite;
      }
      .animate-slide-in {
        animation: slide-in 0.5s ease-out forwards;
      }
      .animate-fade-in-up { animation: fade-in-up 0.4s ease-out forwards; }
      .animate-fade-in-scale { animation: fade-in-scale 0.3s ease-out forwards; }
      .animate-fade-out { animation: fade-out 0.3s ease-out forwards; }
      .animate-fade-out-scale { animation: fade-out-scale 0.3s ease-out forwards; }

      /* Logo Animation */
       @keyframes roll-and-settle-5 {
        0% {
          transform: translateX(-40px) rotate(-360deg);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        60% {
          transform: translateX(0px) rotate(0deg);
        }
        75% {
          transform: translateX(-3px) rotate(0deg); /* Wobble left */
        }
        90% {
          transform: translateX(2px) rotate(0deg); /* Wobble right */
        }
        100% {
          transform: translateX(0) rotate(0deg);
          opacity: 1;
        }
      }
      .animate-logo-5 {
          animation: roll-and-settle-5 2.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      }
      
      @keyframes fade-in-out-reappear {
        0%, 100% { opacity: 0; transform: scale(0.9); }
        10%, 90% { opacity: 1; transform: scale(1); }
      }
      .animate-logo-gif {
        animation: fade-in-out-reappear 8s ease-in-out infinite;
      }
      
       /* Floating Label Form Styles */
      .input-group {
        position: relative;
      }
      .form-input {
        transition: border-color 0.2s;
      }
      .form-input:hover {
        border-color: #576CBC; /* brand-accent */
      }
      .dark .form-input:hover {
        border-color: #FFC107; /* brand-yellow */
      }
      .form-label {
        position: absolute;
        top: 50%;
        left: 0.75rem; /* px-3 */
        transform: translateY(-50%);
        transition: all 0.2s ease-out;
        pointer-events: none;
        background-color: transparent;
        color: #6b7280; /* text-gray-500 */
      }
      .dark .form-label {
        color: #9ca3af; /* text-gray-400 */
      }
      .peer:focus ~ .form-label,
      .peer:not(:placeholder-shown) ~ .form-label {
        top: 0;
        transform: translateY(-50%) scale(0.85);
        font-weight: 500;
        padding: 0 0.25rem;
      }
      /* Light mode background for label */
      .peer:focus ~ .form-label,
      .peer:not(:placeholder-shown) ~ .form-label {
        background-color: #ffffff; /* bg-white */
      }
      .form-input-bg-light .peer:focus ~ .form-label,
      .form-input-bg-light .peer:not(:placeholder-shown) ~ .form-label {
        background-color: #F9FAFB; /* bg-gray-50 */
      }
      /* Dark mode background for label */
      .dark .peer:focus ~ .form-label,
      .dark .peer:not(:placeholder-shown) ~ .form-label {
        background-color: #1A1A2E; /* bg-brand-primary in admin or bg-brand-dark */
      }
       .dark .form-input-bg-dark .peer:focus ~ .form-label,
       .dark .form-input-bg-dark .peer:not(:placeholder-shown) ~ .form-label {
        background-color: #1A1A2E;
      }
      .dark .form-input-bg-darker .peer:focus ~ .form-label,
       .dark .form-input-bg-darker .peer:not(:placeholder-shown) ~ .form-label {
         background-color: #1F2937; /* gray-800/50 */
      }
       .dark .form-input-bg-darkest .peer:focus ~ .form-label,
       .dark .form-input-bg-darkest .peer:not(:placeholder-shown) ~ .form-label {
         background-color: #111827; /* gray-900 */
      }
      
      /* Auth Dropdown */
      .auth-dropdown {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 0.5rem;
        transform-origin: top right;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable dark mode
        theme: {
          extend: {
            colors: {
              'brand-primary': '#0B2447', // Biru Tua
              'brand-secondary': '#1976D2', // Biru Sedang
              'brand-accent': '#576CBC', // Biru Muda
              'brand-light': '#F5F5F5', // Putih Keabuan
              'brand-dark': '#1A1A2E',  // Abu Tua Gelap
              'brand-yellow': '#FFC107', // Kuning untuk logo
              'brand-logo-blue': '#42A5F5' // Biru untuk logo
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              quicksand: ['Quicksand', 'sans-serif'],
              orbitron: ['Orbitron', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Anti-DevTools Script -->
    <script>
      (function() {
        // Disable right-click context menu
        window.addEventListener('contextmenu', e => {
          e.preventDefault();
        });

        // Redirect if dev tools are opened (using debugger trick)
        function detect() {
          const start = new Date().getTime();
          debugger;
          const end = new Date().getTime();
          if (end - start > 100) {
            window.location.href = 'error.html';
          }
        }

        if(window.location.pathname.indexOf('error.html') === -1) {
          setInterval(detect, 1000);
        }
      })();
    </script>
  </body>
</html>
