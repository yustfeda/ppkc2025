    <style>
      html { font-size: 14px; }
      body { 
        font-size: 1rem; 
        background-color: #F5F5F5;
      }
      .dark body {
        background-color: #1A1A2E;
      }
      /* Button & Card hover effect */
      .interactive-card, button, a.button, input[type="submit"], input[type="button"] {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      }
      .interactive-card:hover, button:hover, a.button:hover, input[type="submit"]:hover, input[type="button"]:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      button:active, a.button:active, input[type="submit"]:active, input[type="button"]:active {
        transform: translateY(-1px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
       /* Hamburger Menu Animation */
      .hamburger {
        cursor: pointer;
        padding: 10px;
        display: inline-block;
      }
      .hamburger-line {
        width: 24px;
        height: 2px;
        background-color: #333;
        display: block;
        margin: 5px 0;
        transition: all 0.3s ease-in-out;
      }
      .dark .hamburger-line { background-color: #F5F5F5; }
      .hamburger.is-active .hamburger-line:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      .hamburger.is-active .hamburger-line:nth-child(2) {
        opacity: 0;
      }
      .hamburger.is-active .hamburger-line:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }
      /* Notification & Fade-in Animation */
       @keyframes slide-in {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes float-animation {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float-animation 6s ease-in-out infinite;
      }
      .animate-slide-in {
        animation: slide-in 0.5s ease-out forwards;
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
    </style>
